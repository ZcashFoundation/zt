name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: syntax + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile zt
      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: shellcheck the test script
        run: shellcheck -S warning tests/run.sh

  test:
    name: integration tests
    runs-on: ubuntu-latest
    # The tests drive zt with a fake `cargo`, so no Rust toolchain is needed.
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        run: tests/run.sh
